<title>Md. Adnan Shafiq</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020617;

    padding:20px;

    font-family:
    Inter,
    Segoe UI,
    sans-serif;

}

.card{

    width:100%;
    max-width:350px;

    max-height:80vh;

    background:#0f172a;

    border-radius:16px;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    box-shadow:
    0 10px 30px rgba(0,0,0,.35);

}

.cover {
    position: relative;
    width: 100%;
    height: auto;
    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Bottom-half vignette */
.cover::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at bottom center,
            rgba(0, 0, 0, 0) 100%,
            rgba(0, 0, 0, 0.15) 100%,
            rgba(0, 0, 0, 0.55) 100%
        ),
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(0, 0, 0, 0.65) 100%
        );
}

.content{

    flex:1;

    display:flex;
    flex-direction:column;

    padding:22px;

}

.name{

    font-size:18px;
    font-weight:700;
    color:#fff;

}

.role{

    color:#94a3b8;
    font-size:13px;
    margin-top:10px;

}

.company{

    color:#38bdf8;
    font-weight:600;
    margin-top:16px;
    font-size:14px;

}

.line{

    width:68px;
    height:3px;

    background:#38bdf8;

    border-radius:20px;

    margin:12px 0 18px;

}

.contact{

    display:flex;
    flex-direction:column;
    gap:12px;

}

.contact-item{

    display:flex;
    align-items:flex-start;
    gap:10px;

    color:#94a3b8;
    font-size:13px;

}

.icon{

    width:18px;
    flex-shrink:0;
    color:#38bdf8;

}

.contact-item span:last-child{

    overflow-wrap:anywhere;

}

.save{

    margin-top:22px;

    color:#38bdf8;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    gap:8px;

    font-size:14px;

}

.signature{

    margin-top:auto;

    align-self:flex-end;


    border-radius:10px;

    padding:5px;

}

.signature img{

    width:100px;


    display:block;


}

@media (max-width:360px){

    body{

        padding:12px;

    }

    .card{

        max-width:100%;

    }

    .cover{

        height:auto;

    }

    

    .content{

        padding:18px;

    }

    .name{

        font-size:16px;

    }

    .role,
    .contact-item{

        font-size:12px;

    }

}

</style>
